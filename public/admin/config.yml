backend:
  name: turbo-github
  turbo_site_id: ae2268c0-2095-49f6-96e4-59620d689621
  branch: main
site_url: https://quintonpang.github.io/ahsk-static-website/
display_url: https://quintonpang.github.io/ahsk-static-website/
media_folder: public/assets/uploads
public_folder: assets/uploads
collections:
  - name: events
    label: Events
    label_singular: Event
    folder: src/events
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Summary, name: summary, widget: text}
      - {label: Published, name: published, widget: boolean, default: false}
      - {label: Sample event, name: sample, widget: boolean, default: false}
      - {label: Display order, name: order, widget: number, value_type: int, min: 1, default: 10}
      - {label: Event date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false}
      - {label: Venue, name: venue, widget: string, required: false}
      - label: Image
        name: image
        widget: object
        required: false
        fields:
          - {label: Image file, name: file, widget: image, required: false}
          - {label: Image description, name: alt, widget: string, required: false}
      - label: Description paragraphs
        name: paragraphs
        widget: list
        required: false
        min: 0
        field: {label: Paragraph, name: paragraph, widget: text}

  - name: people
    label: People
    label_singular: Person
    folder: src/people
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} · {{role}}"
    fields:
      - {label: Name, name: name, widget: string}
      - {label: Role, name: role, widget: string}
      - {label: Biography, name: bio, widget: text, required: false}
      - {label: Initials, name: initials, widget: string, required: false, hint: "Used when there is no portrait. Leave blank to generate from the name."}
      - {label: Published, name: published, widget: boolean, default: false}
      - {label: Sample profile, name: sample, widget: boolean, default: false}
      - {label: Display order, name: order, widget: number, value_type: int, min: 1, default: 10}
      - label: Portrait
        name: image
        widget: object
        required: false
        fields:
          - {label: Image file, name: file, widget: image, required: false}
          - {label: Image description, name: alt, widget: string, required: false}
